# ===================================================================
# SPRING BOOT PROPERTIES
# E-Commerce Application Configuration
# ===================================================================

# ===================================================================
# COMMON CONFIGURATION (All Profiles)
# ===================================================================

spring.application.name=ecommerceapp
spring.profiles.active=dev

# JPA / Hibernate - Common settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File upload (multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.directory=${APP_UPLOAD_DIRECTORY:uploads}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=604800000

# Security settings
app.security.max-login-attempts=5
app.security.lockout-duration-minutes=30





# OAuth2 redirect URIs
app.oauth2.authorized-redirect-uris[0]=${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

# Frontend and Backend URLs
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.backend.base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}


# Admin Configuration
app.admin.email=${APP_ADMIN_EMAIL:admin@ecom.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

# ===================================================================
# DEVELOPMENT PROFILE
# ===================================================================

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudflare R2 Configuration
app.r2.access-key=${APP_R2_ACCESS_KEY}
app.r2.secret-key=${APP_R2_SECRET_KEY}
app.r2.bucket-name=${APP_R2_BUCKET_NAME}
app.r2.endpoint=https://${APP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com

app.r2.public-url=${APP_R2_PUBLIC_URL}

# ===================================================================
# GMAIL CONFIGURATION - REPLACE WITH YOUR CREDENTIALS
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


# SSL/TLS Configuration
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender info
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# Server
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging levels
logging.level.com.ecom=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.mail=DEBUG
